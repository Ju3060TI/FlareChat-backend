# wrangler.toml

name = "flarechat-backend"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# D1 DATABASE
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "flarechat-db"
database_id = "deine-d1-datenbank-id"

# ============================================================
# DURABLE OBJECT BINDING
# ============================================================
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# ============================================================
# MIGRATION: SQLite für Durable Object
# ============================================================
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[dev]
port = 8787
