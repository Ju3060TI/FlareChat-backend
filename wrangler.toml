# wrangler.toml

name = "flarechat-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1-Datenbank
[[d1_databases]]
binding = "DB"
database_name = "flarechat-db"
database_id = "deine-d1-datenbank-id"

# ============================================================
# DURABLE OBJECT BINDING
# ============================================================
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# ============================================================
# MIGRATION: SQLite-Datenbank für Durable Object
# ============================================================
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# ============================================================
# UMWELTVARIABLEN
# ============================================================
[vars]
FIREBASE_PROJECT_ID = "dein-project-id"
FIREBASE_PRIVATE_KEY = "dein-private-key"
FIREBASE_CLIENT_EMAIL = "deine-email@example.com"
